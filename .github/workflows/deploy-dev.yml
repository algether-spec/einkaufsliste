name: Deploy dev to /dev subfolder

# GitHub Pages liefert direkt aus main (Root) aus.
# Dieser Workflow spiegelt den dev-Branch nach main/dev/, damit die
# Testversion unter https://algether-spec.github.io/einkaufsliste/dev/ läuft.
# Einzige erlaubte automatische Änderung an main: der Ordner dev/.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-branch

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: dev-Dateien nach main/dev/ spiegeln
        run: |
          mkdir -p main-branch/dev
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='node_modules' \
            dev-branch/ main-branch/dev/

      - name: Nach main pushen
        run: |
          cd main-branch
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A dev/
          git diff --staged --quiet && exit 0
          git commit -m "deploy: dev @ ${GITHUB_SHA::7} → /dev"
          git push origin main
